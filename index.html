<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      /* 基本スタイルは以前のダークモードを継承 */
      body { font-family: sans-serif; padding: 20px; background-color: #121212; color: #e0e0e0; }
      h3 { color: #90caf9; font-size: 14px; margin-bottom: 8px; text-transform: uppercase; }
      
      select, textarea { 
        width: 100%; margin-bottom: 20px; padding: 12px; border-radius: 12px; 
        font-size: 16px; box-sizing: border-box; background-color: #1e1e1e; 
        color: #e0e0e0; border: 1px solid #333; 
      }
      textarea { height: 180px; border: 2px solid #333; }
      
      /* 全件取得ボタン（少し控えめなデザイン） */
      .load-all-btn {
        width: 100%;
        background-color: #444;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 8px;
        margin-top: -10px;
        margin-bottom: 20px;
        font-size: 13px;
        cursor: pointer;
      }
      
      .reg-box { margin-bottom: 20px; background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 12px; }
      .reg-box summary { cursor: pointer; color: #90caf9; }
      .hint { font-size: 13px; line-height: 1.6; color: #bbb; }
      input[type=text] { width: 100%; margin-bottom: 12px; padding: 12px; border-radius: 12px; font-size: 16px; box-sizing: border-box; background: #121212; color: #e0e0e0; border: 1px solid #333; }

      .save-btn {
        width: 100%; height: 60px; background-color: #4caf50; color: white; 
        border: none; border-radius: 12px; font-weight: bold; font-size: 18px; 
      }
      .save-btn:active { transform: translateY(2px); background-color: #388e3c; }
      .save-btn:disabled { background-color: #555; color: #aaa; }
    </style>
  </head>
  <body>

    <h3>📂 追記先のドキュメント</h3>
    <select id="docSelect">
      <option value="">読み込み中...</option>
    </select>
    <button class="load-all-btn" onclick="removeSelected()">選択中のドキュメントの登録を解除</button>

    <details id="regBox" class="reg-box">
      <summary>➕ ドキュメントを登録する</summary>
      <p class="hint">
        【使い方】<br>
        1. 追記したいGoogleドキュメントを開く<br>
        2. ブラウザのアドレスバーのURL（https://docs.google.com/document/d/…）をコピー<br>
        3. 下の欄に貼り付けて「登録」を押す<br>
        ※ URLの代わりにID（/d/ と /edit の間の文字列）だけでもOKです。
      </p>
      <input id="regInput" type="text" placeholder="ドキュメントのURLまたはIDを貼り付け">
      <button class="load-all-btn" style="margin-top:0" onclick="register()">登録</button>
    </details>

    <h3>📝 入力内容</h3>
    <textarea id="output" placeholder="入力してください..."></textarea>

    <button class="save-btn" onclick="submitText()">📄 文書の先頭に保存</button>

    <script>
      // リストを更新する共通関数
      function updateDocList(docs) {
        const select = document.getElementById('docSelect');
        const loadBtn = document.getElementById('loadBtn');
        select.innerHTML = '';
        if (!docs || docs.length === 0) {
          select.innerHTML = '<option value="">ドキュメントが見つかりません</option>';
          return;
        }
        docs.forEach(doc => {
          let opt = document.createElement('option');
          opt.value = doc.id;
          opt.innerHTML = doc.name;
          select.appendChild(opt);
        });
      }

      // 起動時は登録済みドキュメントを表示
      window.onload = () => {
        google.script.run.withSuccessHandler(docs => {
          updateDocList(docs);
          if (!docs || docs.length === 0) document.getElementById('regBox').open = true;
        }).getRegisteredDocs();
      };

      function register() {
        const input = document.getElementById('regInput');
        if (!input.value.trim()) { alert("URLまたはIDを入力してください"); return; }
        google.script.run.withSuccessHandler(res => {
          alert(res.message);
          if (res.ok) { updateDocList(res.docs); input.value = ''; }
        }).registerDoc(input.value);
      }

      function removeSelected() {
        const id = document.getElementById('docSelect').value;
        if (!id || !confirm("選択中のドキュメントの登録を解除しますか？（ドキュメント自体は消えません）")) return;
        google.script.run.withSuccessHandler(updateDocList).removeDoc(id);
      }

      function submitText() {
        const id = document.getElementById('docSelect').value;
        const text = document.getElementById('output').value;
        const btn = document.querySelector('.save-btn');

        if (!id || !text) { alert("項目を入力してください"); return; }

        btn.disabled = true;
        btn.innerHTML = "保存中...";

        google.script.run.withSuccessHandler(msg => {
          alert(msg);
          document.getElementById('output').value = ''; 
          btn.disabled = false;
          btn.innerHTML = "📄 文書の先頭に保存";
        }).addTextToTop(id, text);
      }
    </script>
  </body>
</html>
